# Fauna. Deer herds streamed around the player from the same seed the trees and
# stones use, so a herd is always in country that could feed one.
faunaEnabled: 1
faunaDeerDesktopCount: 10
faunaDeerCompactCount: 4
# Villagers stay near the player's spawn rather than streaming, so a person is
# always somewhere findable rather than appearing out in open country.
faunaVillagerDesktopCount: 3
faunaVillagerCompactCount: 1
faunaVillagerWalkSpeed: 1.35
# Comfortably past the cull distance plus the retire margin, so there is always
# a herd ahead to recycle a retired animal onto.
faunaStreamRadius: 170
faunaDeerWalkSpeed: 1.15
# Animation quality bands. Contact IK and secondary motion stop at the reduced
# boundary, where a foot sinking a few centimetres is under a pixel; the pose
# rate drops before that, which is invisible because the gait phase is driven by
# distance travelled rather than by time.
faunaFullDistance: 18
faunaReducedDistance: 45
faunaMinimalDistance: 90
faunaCullDistance: 130
faunaReducedUpdateHz: 20
faunaMinimalUpdateHz: 6
# Deciding what to do next is far cheaper than animating, and stays running for
# animals that are too far away to be drawn.
faunaBehaviorHz: 5
